<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Habit Tracker</h1>

    <form id="add-form">
      <input id="habit-input" type="text" placeholder="New habit" aria-label="New habit" autocomplete="off" autofocus>
      <button type="submit">Add</button>
    </form>

    <p id="empty-message">No habits yet. Add your first one above.</p>
    <ul id="habit-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
