<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Habit Tracker</h1>
    <div id="counter" hidden>
      <p id="counter-line">
        <span id="counter-text"></span>
        <span id="counter-all-done" hidden>All done for today!</span>
      </p>
      <div id="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
    </div>

    <p id="empty-message">No habits yet. Add your first one below.</p>
    <ul id="habit-list"></ul>

    <form id="add-form">
      <input id="habit-input" type="text" placeholder="New habit" aria-label="New habit" autocomplete="off" autofocus>
      <button type="submit">Add</button>
    </form>

    <p id="undo-message" role="status" hidden>
      <span id="undo-text"></span>
      <button id="undo-button" type="button">Undo</button>
    </p>
    <p id="save-message" role="status" hidden>Could not save. Your changes may be lost when you reload.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
